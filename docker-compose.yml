services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ashland
      POSTGRES_PASSWORD: ashland
      POSTGRES_DB: ashland_calendar
    ports:
      - "5432:5432"
    volumes:
      - ashland_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ashland -d ashland_calendar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ashland_pg:
