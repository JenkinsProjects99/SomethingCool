  <script>
    const EVENTS = JSON.parse(document.getElementById("seed").textContent);
    const LOGO = "./brand/visit-aky-logo.png";
    const NOW = Date.parse("2026-08-29T15:00:00-04:00");
    const TODAY = Date.parse("2026-08-29T00:00:00-04:00");
    const LOOKBACK = Date.parse("2026-08-22T00:00:00-04:00");
    const WEEK_END = Date.parse("2026-09-05T00:00:00-04:00");
    const RANK = { music: 10, family: 20, community: 30, arts: 40, food: 50, outdoor: 60, sports: 70 };
    const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

    function isFirstFriday(event) {
      return /first[\s-]?friday/i.test(`${event.id} ${event.title}`);
    }
    function filterSports(events) {
      return events.filter((event) => event.category === "sports" && !isFirstFriday(event));
    }
    function inWindow(event) {
      return event.startsMs >= LOOKBACK;
    }
    function inThisWeek(event) {
      return event.startsMs >= TODAY && event.startsMs < WEEK_END;
    }
    function sortUpcomingFirst(events) {
      const upcoming = events.filter((event) => event.startsMs >= TODAY).sort(byTourist);
      const recent = events.filter((event) => event.startsMs < TODAY).sort(byTourist);
      return upcoming.concat(recent);
    }
    function byTourist(left, right) {
      return (left.startsMs - right.startsMs) || (RANK[left.category] - RANK[right.category]);
    }
    function filterCategory(events, cat) {
      if (cat === "all") return events;
      if (cat === "sports") return filterSports(events);
      return events.filter((event) => event.category === cat);
    }
    function eventsForView() {
      const windowed = EVENTS.filter(inWindow);
      if (time === "week") return filterCategory(windowed.filter(inThisWeek), cat).sort(byTourist);
      return filterCategory(sortUpcomingFirst(windowed), cat);
    }
    function cardHtml(event, featured) {
      const src = event.image || LOGO;
      const imgClass = event.image ? "photo-card__image" : "photo-card__image photo-card__image--logo";
      const feat = featured ? " photo-card--featured" : "";
      return `<a class="photo-card photo-card--${event.category}${feat}" href="${event.url}" target="_blank" rel="noreferrer" data-id="${event.id}" data-category="${event.category}">
        <img class="${imgClass}" src="${src}" alt="">
        <div class="photo-card__overlay">
          <h2 class="photo-card__title">${event.title}</h2>
          <p class="photo-card__when"><time datetime="${event.startsAt}">${event.when}</time></p>
          <p class="st-d-subheading">${event.source}</p>
        </div>
      </a>`;
    }

    let time = "week";
    let cat = "all";
    let cursor = { year: 2026, month: 8 };
    let selected = "2026-08-29";

    function ymd(ms) {
      const d = new Date(ms);
      const parts = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(d);
      const read = (type) => parts.find((part) => part.type === type).value;
      return `${read("year")}-${read("month")}-${read("day")}`;
    }
    function renderCards() {
      const rows = eventsForView();
      document.getElementById("cards").innerHTML = rows.length
        ? rows.map((event, index) => cardHtml(event, index === 0)).join("")
        : `<p class="st-d-paragraph">No published events in this view yet.</p>`;
    }
    function daysInMonth(year, month) { return new Date(Date.UTC(year, month, 0)).getUTCDate(); }
    function firstWeekday(year, month) { return new Date(Date.UTC(year, month - 1, 1)).getUTCDay(); }
    function renderCalendar() {
      const windowed = filterCategory(EVENTS.filter(inWindow), cat);
      document.getElementById("cal-title").textContent = `${MONTHS[cursor.month - 1]} ${cursor.year}`;
      const byDay = {};
      for (const event of windowed) {
        const key = ymd(event.startsMs);
        (byDay[key] ||= []).push(event);
      }
      const blanks = firstWeekday(cursor.year, cursor.month);
      const count = daysInMonth(cursor.year, cursor.month);
      let cells = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map((d) => `<p class="month-cal__dow">${d}</p>`).join("");
      for (let i = 0; i < blanks; i += 1) cells += `<div class="month-cal__cell month-cal__cell--empty"></div>`;
      for (let day = 1; day <= count; day += 1) {
        const key = `${cursor.year}-${String(cursor.month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
        const hits = byDay[key] || [];
        const on = selected === key ? " month-cal__cell--on" : "";
        const has = hits.length ? " month-cal__cell--has" : "";
        const dot = hits.length ? `<i class="month-cal__dot" aria-hidden="true"></i>` : "";
        cells += `<button type="button" class="month-cal__cell${on}${has}" data-day="${key}"><span>${day}</span>${dot}</button>`;
      }
      document.getElementById("cal-grid").innerHTML = cells;
      const selectedEvents = (byDay[selected] || []).slice().sort((left, right) => left.startsMs - right.startsMs);
      document.getElementById("cal-list").innerHTML = selectedEvents.length
        ? selectedEvents.map((event) => `<li><a href="${event.url}" target="_blank" rel="noreferrer"><strong>${event.title}</strong><span>${event.when} · ${event.source}</span></a></li>`).join("")
        : `<li class="st-d-paragraph">No events on this date. Pick a dotted day.</li>`;
      document.querySelectorAll(".month-cal__cell[data-day]").forEach((cell) => {
        cell.onclick = () => { selected = cell.getAttribute("data-day"); renderCalendar(); };
      });
    }
    function blurbs() {
      if (time === "calendar") return "Pick a day. Confirm times before you go.";
      if (time === "week") return "This week first in Eastern Time. Confirm times before you go.";
      return "Upcoming first in Eastern Time. Confirm times before you go.";
    }
    function show() {
      const isCal = time === "calendar";
      document.getElementById("calendar").classList.toggle("hidden", !isCal);
      document.getElementById("cards").classList.toggle("hidden", isCal);
      document.getElementById("blurb").textContent = blurbs();
      document.querySelectorAll("[data-time]").forEach((el) => {
        const on = el.getAttribute("data-time") === time;
        el.className = on ? "st-primary" : "st-secondary";
        el.setAttribute("aria-selected", String(on));
      });
      document.querySelectorAll("[data-cat]").forEach((el) => {
        const on = el.getAttribute("data-cat") === cat;
        el.className = on ? "st-primary" : "st-secondary";
        el.setAttribute("aria-selected", String(on));
      });
      if (isCal) renderCalendar();
      else renderCards();
    }
    document.querySelectorAll("[data-time]").forEach((button) => {
      button.onclick = () => {
        time = button.getAttribute("data-time");
        show();
      };
    });
    document.querySelectorAll("[data-cat]").forEach((button) => {
      button.onclick = () => {
        cat = button.getAttribute("data-cat");
        show();
      };
    });
    document.getElementById("prev-month").onclick = () => {
      cursor.month -= 1;
      if (cursor.month === 0) { cursor.month = 12; cursor.year -= 1; }
      renderCalendar();
    };
    document.getElementById("next-month").onclick = () => {
      cursor.month += 1;
      if (cursor.month === 13) { cursor.month = 1; cursor.year += 1; }
      renderCalendar();
    };
    const hash = location.hash.replace("#", "");
    if (["upcoming", "week", "calendar"].includes(hash)) time = hash;
    if (["music", "sports", "community", "family"].includes(hash)) cat = hash;
    show();
  </script>
