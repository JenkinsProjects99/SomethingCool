name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ashland
          POSTGRES_PASSWORD: ashland
          POSTGRES_DB: ashland_calendar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ashland -d ashland_calendar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ashland:ashland@localhost:5432/ashland_calendar
      ASHLAND_KY_API_TOKEN: dev-ashland-ky-local-token
      LOG_LEVEL: info
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx prisma migrate deploy
      - run: npm run seed
      - run: npm run seed:reload
      - run: npm run test:integration
      - run: npm run build
